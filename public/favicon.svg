<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0d2410"/>
      <stop offset="100%" stop-color="#030a04"/>
    </radialGradient>
    <linearGradient id="gA" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#f7df80"/>
      <stop offset="40%" stop-color="#d4a843"/>
      <stop offset="100%" stop-color="#8a6010"/>
    </linearGradient>
    <linearGradient id="gB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c855"/>
      <stop offset="100%" stop-color="#b88820"/>
    </linearGradient>
    <linearGradient id="gDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a5010"/>
      <stop offset="100%" stop-color="#4a3008"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Subtle vignette border -->
  <rect width="512" height="512" rx="96" fill="none" stroke="rgba(212,168,67,0.18)" stroke-width="6"/>

  <!-- ── COBRA BODY (coiled base) ── -->
  <!-- Outer coil -->
  <ellipse cx="256" cy="400" rx="130" ry="42" fill="url(#gDark)" opacity="0.9"/>
  <ellipse cx="256" cy="400" rx="105" ry="30" fill="url(#gB)" opacity="0.85"/>
  <ellipse cx="256" cy="400" rx="75" ry="18" fill="url(#gDark)" opacity="0.7"/>

  <!-- Body rising from coil -->
  <path d="M 220 395 C 215 340 210 280 230 230 C 245 195 256 180 256 165"
        stroke="url(#gA)" stroke-width="44" fill="none" stroke-linecap="round"/>
  <path d="M 292 395 C 297 340 302 280 282 230 C 267 195 256 180 256 165"
        stroke="url(#gA)" stroke-width="44" fill="none" stroke-linecap="round"/>
  <!-- Body center shadow -->
  <path d="M 256 395 C 252 340 248 280 252 230 C 254 195 256 180 256 165"
        stroke="url(#gDark)" stroke-width="18" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- ── HOOD (spread wide) ── -->
  <!-- Hood outer shape -->
  <path d="M 256 85
           C 256 85 170 75 128 105
           C 88 133 90 170 110 190
           C 128 208 180 215 256 218
           C 332 215 384 208 402 190
           C 422 170 424 133 384 105
           C 342 75 256 85 256 85 Z"
        fill="url(#gA)" filter="url(#glow)"/>

  <!-- Hood inner darker area -->
  <path d="M 256 105
           C 256 105 192 98 162 120
           C 134 140 138 165 155 178
           C 170 190 210 196 256 198
           C 302 196 342 190 357 178
           C 374 165 378 140 350 120
           C 320 98 256 105 256 105 Z"
        fill="#0d2010" opacity="0.6"/>

  <!-- Hood scale ribs -->
  <path d="M 256 108 L 256 195" stroke="rgba(212,168,67,0.3)" stroke-width="2"/>
  <path d="M 220 112 C 218 140 220 170 222 195" stroke="rgba(212,168,67,0.2)" stroke-width="1.5"/>
  <path d="M 292 112 C 294 140 292 170 290 195" stroke="rgba(212,168,67,0.2)" stroke-width="1.5"/>
  <path d="M 186 125 C 182 148 186 172 190 192" stroke="rgba(212,168,67,0.15)" stroke-width="1.5"/>
  <path d="M 326 125 C 330 148 326 172 322 192" stroke="rgba(212,168,67,0.15)" stroke-width="1.5"/>
  <!-- Hood arc lines -->
  <path d="M 148 155 Q 256 135 364 155" stroke="rgba(212,168,67,0.25)" stroke-width="1.5" fill="none"/>
  <path d="M 132 175 Q 256 155 380 175" stroke="rgba(212,168,67,0.2)" stroke-width="1.5" fill="none"/>

  <!-- ── HEAD ── -->
  <!-- Head shape -->
  <ellipse cx="256" cy="215" rx="46" ry="34" fill="url(#gA)" filter="url(#softglow)"/>
  <!-- Head top rounded -->
  <ellipse cx="256" cy="205" rx="38" ry="28" fill="url(#gB)"/>

  <!-- ── EYES ── -->
  <!-- Eye sockets -->
  <ellipse cx="234" cy="207" rx="13" ry="13" fill="#050e05"/>
  <ellipse cx="278" cy="207" rx="13" ry="13" fill="#050e05"/>
  <!-- Iris -->
  <ellipse cx="234" cy="207" rx="9" ry="10" fill="#cc1100"/>
  <ellipse cx="278" cy="207" rx="9" ry="10" fill="#cc1100"/>
  <!-- Pupil (vertical slit) -->
  <ellipse cx="234" cy="207" rx="3" ry="7" fill="#0a0a0a"/>
  <ellipse cx="278" cy="207" rx="3" ry="7" fill="#0a0a0a"/>
  <!-- Eye shine -->
  <circle cx="237" cy="203" r="2.5" fill="rgba(255,255,255,0.7)"/>
  <circle cx="281" cy="203" r="2.5" fill="rgba(255,255,255,0.7)"/>
  <!-- Eye gold rim -->
  <ellipse cx="234" cy="207" rx="13" ry="13" fill="none" stroke="rgba(212,168,67,0.6)" stroke-width="1.5"/>
  <ellipse cx="278" cy="207" rx="13" ry="13" fill="none" stroke="rgba(212,168,67,0.6)" stroke-width="1.5"/>

  <!-- ── SNOUT & SCALES ── -->
  <ellipse cx="256" cy="228" rx="20" ry="12" fill="url(#gDark)"/>
  <ellipse cx="256" cy="225" rx="15" ry="8" fill="url(#gB)" opacity="0.5"/>
  <!-- Nostril dots -->
  <circle cx="249" cy="226" r="2.5" fill="#0a0a0a" opacity="0.8"/>
  <circle cx="263" cy="226" r="2.5" fill="#0a0a0a" opacity="0.8"/>

  <!-- ── TONGUE ── -->
  <path d="M 252 238 L 256 258 L 260 238" stroke="#cc1100" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 256 258 L 246 272 M 256 258 L 266 272" stroke="#cc1100" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- ── CARD SUIT ACCENTS (bottom corners of hood) ── -->
  <text x="152" y="200" font-size="22" fill="rgba(212,168,67,0.55)" font-family="serif" text-anchor="middle">♠</text>
  <text x="360" y="200" font-size="22" fill="rgba(212,168,67,0.55)" font-family="serif" text-anchor="middle">♠</text>
</svg>
